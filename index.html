<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<title>Hussein · huha_2007</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070a;
    --panel:#0b0f14;
    --panel-alt:#10161d;
    --line: rgba(61,220,151,.22);
    --line-soft: rgba(61,220,151,.10);
    --green:#34e8a1;
    --green-dim:#1f8a63;
    --violet:#8b7cff;
    --cyan:#4fb3ff;
    --pink:#ff5fa2;
    --text:#dbe4ec;
    --muted:#6b7684;
    --mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, monospace;
    --arabic:'IBM Plex Sans Arabic','IBM Plex Mono', sans-serif;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  html,body{height:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--arabic);
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
    overflow-x:hidden;
  }

  canvas#matrix{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:.5;
    pointer-events:none;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:0;
    background:
      radial-gradient(60% 50% at 50% 8%, rgba(52,232,161,.10), transparent 60%),
      radial-gradient(50% 40% at 85% 90%, rgba(139,124,255,.08), transparent 60%);
    pointer-events:none;
  }

  .stage{
    position:relative;
    z-index:1;
    width:100%;
    max-width:440px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .terminal{
    width:100%;
    background:linear-gradient(180deg, var(--panel), #090c10);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:
      0 0 0 1px rgba(0,0,0,.6),
      0 30px 80px -20px rgba(0,0,0,.85),
      0 0 60px -20px rgba(52,232,161,.15);
    overflow:hidden;
  }

  .titlebar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:11px 14px;
    background:var(--panel-alt);
    border-bottom:1px solid var(--line-soft);
    direction:ltr;
  }
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .dot-r{background:#ff5f56}
  .dot-y{background:#ffbd2e}
  .dot-g{background:#27c93f}
  .titlebar .path{
    margin-inline-start:8px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--muted);
    letter-spacing:.02em;
  }

  .term-body{
    padding:30px 24px 26px;
    text-align:center;
  }

  .avatar-wrap{
    position:relative;
    width:140px;
    height:140px;
    margin:0 auto 18px;
    display:grid;
    place-items:center;
  }
  .avatar-wrap::before{
    content:"";
    position:absolute;
    inset:-10px;
    background:conic-gradient(from 0deg, var(--green), var(--cyan), var(--violet), var(--pink), var(--green));
    filter:blur(11px);
    opacity:.55;
    clip-path:polygon(25% 3%, 75% 3%, 100% 50%, 75% 97%, 25% 97%, 0% 50%);
    animation:spin 10s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .avatar{
    position:relative;
    width:128px;
    height:128px;
    object-fit:cover;
    clip-path:polygon(25% 4%, 75% 4%, 100% 50%, 75% 96%, 25% 96%, 0% 50%);
    background:#000;
    display:block;
  }

  .name{
    font-family:var(--mono);
    font-size:26px;
    font-weight:600;
    margin:0 0 8px;
    color:var(--text);
    direction:ltr;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:8px;
    text-shadow:0 0 24px rgba(52,232,161,.25);
  }
  .name .prompt{color:var(--green)}
  .cursor{
    color:var(--green);
    animation:blink 1s step-end infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .role{
    font-family:var(--mono);
    font-size:13px;
    color:var(--muted);
    margin:0 0 22px;
    line-height:1.7;
    direction:ltr;
  }

  .divider{
    height:1px;
    background:linear-gradient(90deg, transparent, var(--line), transparent);
    margin:20px 0;
  }

  .links{
    display:flex;
    flex-direction:column;
    gap:10px;
    text-align:start;
  }
  .link{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 14px;
    border:1px solid var(--line-soft);
    border-radius:10px;
    background:rgba(255,255,255,.015);
    color:var(--text);
    text-decoration:none;
    font-family:var(--arabic);
    font-size:15px;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .link:hover{transform:translateY(-1px)}
  .link .icon{
    width:20px;height:20px;flex:none;
    display:grid;place-items:center;
    color:var(--muted);
    transition:color .2s ease;
  }
  .link .cmd{flex:1}
  .link .tag{
    font-size:11px;
    color:var(--muted);
    opacity:.8;
  }

  .link.tg:hover{border-color:rgba(79,179,255,.5); background:rgba(79,179,255,.06)}
  .link.tg:hover .icon{color:var(--cyan)}
  .link.wa:hover{border-color:rgba(52,232,161,.5); background:rgba(52,232,161,.06)}
  .link.wa:hover .icon{color:var(--green)}
  .link.ig:hover{border-color:rgba(255,95,162,.5); background:rgba(255,95,162,.06)}
  .link.ig:hover .icon{color:var(--pink)}

  .rain-btn{
    width:100%;
    margin-top:4px;
    padding:14px;
    border-radius:10px;
    border:1px solid var(--green-dim);
    background:linear-gradient(180deg, rgba(52,232,161,.14), rgba(52,232,161,.05));
    color:var(--green);
    font-family:var(--arabic);
    font-size:15.5px;
    font-weight:500;
    cursor:pointer;
    transition:background .2s ease, box-shadow .2s ease, transform .05s ease;
  }
  .rain-btn:hover{
    background:linear-gradient(180deg, rgba(52,232,161,.22), rgba(52,232,161,.08));
    box-shadow:0 0 30px -6px rgba(52,232,161,.55);
  }
  .rain-btn:active{transform:scale(.98)}
  .rain-btn:focus-visible, .link:focus-visible{
    outline:2px solid var(--green);
    outline-offset:2px;
  }

  .footnote{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--muted);
    text-align:center;
    direction:ltr;
    opacity:.75;
  }

  .emoji-fall{
    position:fixed;
    top:-40px;
    font-size:28px;
    z-index:5;
    pointer-events:none;
    will-change:transform;
    animation-name:fall;
    animation-timing-function:linear;
    animation-fill-mode:forwards;
  }
  @keyframes fall{
    to{ transform: translateY(110vh) rotate(var(--rot,180deg)); }
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-wrap::before{animation:none}
    .cursor{animation:none}
  }

  @media (max-width:380px){
    .term-body{padding:24px 16px 20px}
    .name{font-size:22px}
  }
</style>
</head>

<script>

// ---- typing effect ----
(function(){
  const target = "Hussein Mhmood";
  const el = document.getElementById('typed');
  let i = 0;
  function tick(){
    if(i <= target.length){
      el.textContent = target.slice(0, i);

      setTimeout(tick, 95);
    }
  }
  tick();
})();

// ---- matrix rain ----
(function(){
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');
  let w, h, cols, drops;
  const chars = "01アイウエオカキクケコサシスセソタチツテトナニヌネノ日ﾊﾋﾌﾍﾎ$#@&+".split("");
  const fontSize = 15;

  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    cols = Math.floor(w / fontSize);
    drops = new Array(cols).fill(0).map(()=> Math.floor(Math.random() * -40));
  }
  window.addEventListener('resize', resize);
  resize();

  function draw(){
    ctx.fillStyle = "rgba(5,7,10,0.14)";
    ctx.fillRect(0,0,w,h);
    ctx.font = fontSize + "px monospace";
    for(let x=0; x<cols; x++){
      const char = chars[Math.floor(Math.random()*chars.length)];
      const y = drops[x] * fontSize;
      const grad = Math.random();
      ctx.fillStyle = grad > .96 ? "rgba(139,124,255,0.85)" : "rgba(52,232,161,0.55)";
      ctx.fillText(char, x*fontSize, y);
      if(y > h && Math.random() > .975){
        drops[x] = 0;
      }
      drops[x]++;
    }
  }
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    setInterval(draw, 45);
  } else {
    ctx.fillStyle = "rgba(5,7,10,1)";
    ctx.fillRect(0,0,w,h);
  }
})();

// ---- emoji rain ----
(function(){
  const btn = document.getElementById('rainBtn');
  const emojis = ["💻","👾","🔥","⚡","🖥️","🔐","🚀","✨","🌐","🧠","💾","🛰️"];
  btn.addEventListener('click', () => {
    const count = 46;
    for(let i=0;i<count;i++){
      setTimeout(() => {
        const span = document.createElement('span');
        span.className = 'emoji-fall';
        span.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        const left = Math.random()*100;
        const duration = 3.2 + Math.random()*2.2;
        const delay = 0;
        const rot = (Math.random()>0.5?1:-1) * (120 + Math.random()*240);
        span.style.left = left + "vw";
        span.style.setProperty('--rot', rot + 'deg');
        span.style.animationDuration = duration + "s";
        span.style.fontSize = (20 + Math.random()*18) + "px";
        document.body.appendChild(span);
        span.addEventListener('animationend', () => span.remove());
      }, i * 45);
    }
  });
})();
</script>
